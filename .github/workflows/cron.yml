name: Hourly & Daily Tracker

on:
  schedule:
    # A. 팔로워 + 라이브/소식 (한국 시간 12:07, 00:07, 06:07 -> UTC 03, 15, 21)
    #    ※ 이 문자열을 바꾸면 아래 Follower Tracker 스텝의 if 조건도 함께 고칠 것
    - cron: '7 3,15,21 * * *'
    # B. 라이브/소식만 (한국 시간 09:07, 15:07 -> UTC 00, 06)
    - cron: '7 0,6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # keepalive 빈 커밋 push 용
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # FollowerStats 시트는 중복 검사 없이 append 되므로 하루 3회(스케줄 A)로 제한한다.
      # 수동 실행(workflow_dispatch)은 점검용이라 항상 실행.
      - name: Run Follower Tracker
        if: github.event_name != 'schedule' || github.event.schedule == '7 3,15,21 * * *'
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node follower_tracker.js

      - name: Run Live/Story Crawler
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node seller-live.js

      # public 저장소는 커밋이 60일간 없으면 schedule 트리거가 자동으로 꺼진다.
      # 45일이 넘었을 때만 빈 커밋을 남겨 타이머를 리셋한다.
      # 크롤러가 실패해도 keepalive는 돌아야 하므로 always() 사용.
      - name: Keepalive
        if: always()
        env:
          THRESHOLD_DAYS: 45
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "마지막 커밋으로부터 ${age}일 경과 (임계값 ${THRESHOLD_DAYS}일)"
          if [ "$age" -lt "$THRESHOLD_DAYS" ]; then
            echo "여유 있음 — 건너뜀"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (스케줄 자동 비활성화 방지)"
          git push
