name: Hourly & Daily Tracker

on:
  schedule:
    # 1. 팔로워 트래킹 (한국 시간 12:07, 00:07, 06:07 -> UTC 03, 15, 21)
    - cron: '7 3,15,21 * * *'
    # 2. 라이브/소식 (한국 시간 09:07, 15:07 -> UTC 00, 06)
    - cron: '7 0,6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      # --- [팔로워 트래커 실행 조건] ---
      - name: Run Follower Tracker
        # 수동 실행이거나, 팔로워용 크론 시간대(3, 15, 21시)일 때 실행
        if: |
          github.event_name == 'workflow_dispatch' || 
          contains(github.event.schedule, '7 3,15,21')
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node follower_tracker.js

      # --- [라이브/소식 크롤러 실행 조건] ---
      - name: Run Live/Story Crawler
        # 수동 실행이거나, 라이브용 크론 시간대(0, 6시)일 때 실행
        if: |
          github.event_name == 'workflow_dispatch' || 
          contains(github.event.schedule, '7 0,6')
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node seller-live.js
