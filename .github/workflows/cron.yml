name: Hourly & Daily Tracker

on:
  schedule:
    - cron: '0 * * * *'      # 매시간 정각 실행 (팔로워 트래킹용)
    - cron: '0 0,9 * * *'    # 한국시간 09:00, 18:00 실행 (라이브/소식용)
  workflow_dispatch:          # 수동 실행 버튼 활성화

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium

      - name: Run Follower Tracker
        # 매시간 실행 설정
        if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node follower_tracker.js

      - name: Run Live/Story Crawler
        # 오전 9시, 오후 6시 실행 설정
        if: github.event.schedule == '0 0,9 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node seller-live.js
