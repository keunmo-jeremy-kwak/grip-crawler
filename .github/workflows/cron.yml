name: Hourly & Daily Tracker

on:
  schedule:
    # 1. 팔로워 트래킹 (한국 시간 12:07, 00:07, 06:07 -> UTC 03, 15, 21)
    - cron: '7 3,15,21 * * *'
    # 2. 라이브/소식 (한국 시간 09:07, 15:07 -> UTC 00, 06)
    - cron: '7 0,6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Follower Tracker
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node follower_tracker.js

      - name: Run Live/Story Crawler
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: node seller-live.js
